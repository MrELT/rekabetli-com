<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giriş Yap | rekabetli.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="assets/rekabetli_logo.png"/>
    <link rel="apple-touch-icon" href="assets/rekabetli_logo.png">
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="env-config.js"></script>
    <script src="supabase-client.js"></script>
      <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body class="login-body">
    <main class="layout auth-layout">
      <section class="panel auth-panel">
        <h1>Giriş Yap</h1>
        <p class="auth-subtitle">Hesabına giriş yap ve rekabetli.com'da gelişimini takip et.</p>

        <form id="login-form">
          <label for="email">E-posta</label>
          <input id="email" name="email" type="email" required />

          <label for="password">Şifre</label>
          <input id="password" name="password" type="password" minlength="6" required />

          <button type="submit">Giriş Yap</button>
        </form>

        <a id="register-btn" class="secondary full-width auth-link-btn" href="/register">Kayıt Ol</a>
        <p id="auth-message" class="empty"></p>
      </section>
    </main>

    <script src="login.js"></script>
  </body>
</html>
