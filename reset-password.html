<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Şifre Yenile | rekabetli.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="assets/rekabetli_logo.png" />
    <link rel="apple-touch-icon" href="assets/rekabetli_logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="env-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-store.js"></script>
    <script src="security-utils.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body class="login-body">
    <main class="layout auth-layout">
      <section class="panel auth-panel">
        <h1>Şifre Yenile</h1>
        <p class="auth-subtitle">Yeni şifreni belirle ve hesabına güvenli şekilde dön.</p>

        <form id="reset-password-form">
          <label for="password">Yeni şifre</label>
          <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required />

          <label for="password-confirm">Yeni şifre tekrar</label>
          <input
            id="password-confirm"
            name="passwordConfirm"
            type="password"
            minlength="6"
            autocomplete="new-password"
            required
          />

          <button type="submit" id="reset-password-submit">Şifremi yenile</button>
        </form>

        <a class="secondary full-width auth-link-btn" href="/login">Giriş ekranına dön</a>
        <p id="reset-password-message" class="empty" role="status"></p>
      </section>
    </main>

    <script src="reset-password.js"></script>
  </body>
</html>
