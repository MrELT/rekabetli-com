<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Paneli | rekabetli.com</title>
    <link rel="icon" type="image/png" href="assets/rekabetli_logo.png" />
    <link rel="apple-touch-icon" href="assets/rekabetli_logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="env-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-store.js"></script>
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body class="profile-page">
    <nav class="profile-page-nav">
      <a class="brand" href="/">
        <img src="assets/rekabetli.png" alt="Rekabetli" class="brand-logo" />
      </a>
      <div class="profile-page-nav-actions">
        <a class="nav-btn" href="/">← Ana Sayfa</a>
        <a class="nav-btn" href="/profile">Profilim</a>
      </div>
    </nav>

    <main class="layout auth-layout profile-page-layout">
      <section class="panel auth-panel profile-panel admin-panel">
        <h1>Admin Paneli</h1>
        <p class="auth-subtitle">
          Mentör başvuruları, mentörlük talepleri ve kullanıcı listesi.
        </p>
        <p id="admin-message" class="profile-message empty"></p>

        <div class="activity-accordion profile-page-accordion admin-page-accordion" id="admin-accordion">
          <section class="activity-accordion-section is-open" data-section="mentor-applications">
            <button
              type="button"
              class="activity-accordion-trigger"
              id="trigger-mentor-applications"
              aria-expanded="true"
              aria-controls="panel-mentor-applications"
            >
              <span class="activity-accordion-title">Mentör Başvuruları</span>
              <span class="activity-accordion-meta">
                <span id="admin-count-applications" class="activity-accordion-count">0</span>
                <span class="activity-accordion-chevron" aria-hidden="true"></span>
              </span>
            </button>
            <div
              id="panel-mentor-applications"
              class="activity-accordion-panel admin-accordion-panel"
              role="region"
              aria-labelledby="trigger-mentor-applications"
            >
              <div class="admin-table-wrap">
                <table class="admin-table" id="admin-mentor-applications-table">
                  <thead>
                    <tr>
                      <th>Ad Soyad</th>
                      <th>E-posta</th>
                      <th>Branşlar</th>
                      <th>Haftalık</th>
                      <th>Durum</th>
                      <th>Tarih</th>
                    </tr>
                  </thead>
                  <tbody id="admin-mentor-applications-body"></tbody>
                </table>
              </div>
            </div>
          </section>

          <section class="activity-accordion-section" data-section="mentorship-requests">
            <button
              type="button"
              class="activity-accordion-trigger"
              id="trigger-mentorship-requests"
              aria-expanded="false"
              aria-controls="panel-mentorship-requests"
            >
              <span class="activity-accordion-title">Mentörlük Talepleri</span>
              <span class="activity-accordion-meta">
                <span id="admin-count-requests" class="activity-accordion-count">0</span>
                <span class="activity-accordion-chevron" aria-hidden="true"></span>
              </span>
            </button>
            <div
              id="panel-mentorship-requests"
              class="activity-accordion-panel admin-accordion-panel"
              role="region"
              aria-labelledby="trigger-mentorship-requests"
            >
              <div class="admin-table-wrap">
                <table class="admin-table" id="admin-mentorship-requests-table">
                  <thead>
                    <tr>
                      <th>Ad Soyad</th>
                      <th>E-posta</th>
                      <th>Branşlar</th>
                      <th>Aylık</th>
                      <th>Durum</th>
                      <th>Tarih</th>
                    </tr>
                  </thead>
                  <tbody id="admin-mentorship-requests-body"></tbody>
                </table>
              </div>
            </div>
          </section>

          <section class="activity-accordion-section" data-section="users">
            <button
              type="button"
              class="activity-accordion-trigger"
              id="trigger-admin-users"
              aria-expanded="false"
              aria-controls="panel-admin-users"
            >
              <span class="activity-accordion-title">Kullanıcılar</span>
              <span class="activity-accordion-meta">
                <span id="admin-count-users" class="activity-accordion-count">0</span>
                <span class="activity-accordion-chevron" aria-hidden="true"></span>
              </span>
            </button>
            <div
              id="panel-admin-users"
              class="activity-accordion-panel admin-accordion-panel"
              role="region"
              aria-labelledby="trigger-admin-users"
            >
              <div class="admin-table-wrap">
                <table class="admin-table" id="admin-users-table">
                  <thead>
                    <tr>
                      <th>Kullanıcı</th>
                      <th>E-posta</th>
                      <th>Tür</th>
                      <th>Mentör</th>
                      <th>İşlem</th>
                    </tr>
                  </thead>
                  <tbody id="admin-users-body"></tbody>
                </table>
              </div>
            </div>
          </section>

          <section class="activity-accordion-section" data-section="communities">
            <button
              type="button"
              class="activity-accordion-trigger"
              id="trigger-admin-communities"
              aria-expanded="false"
              aria-controls="panel-admin-communities"
            >
              <span class="activity-accordion-title">Topluluklar</span>
              <span class="activity-accordion-meta">
                <span id="admin-count-communities" class="activity-accordion-count">0</span>
                <span class="activity-accordion-chevron" aria-hidden="true"></span>
              </span>
            </button>
            <div
              id="panel-admin-communities"
              class="activity-accordion-panel admin-accordion-panel"
              role="region"
              aria-labelledby="trigger-admin-communities"
            >
              <div class="admin-table-wrap">
                <table class="admin-table" id="admin-communities-table">
                  <thead>
                    <tr>
                      <th>Topluluk</th>
                      <th>Görünürlük</th>
                      <th>Kurucu</th>
                      <th>Oluşturulma</th>
                      <th>İşlem</th>
                    </tr>
                  </thead>
                  <tbody id="admin-communities-body"></tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div id="admin-mentor-assign-modal" class="modal-overlay" hidden>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="admin-mentor-assign-title">
        <div class="modal-header">
          <h2 id="admin-mentor-assign-title">Gizli Topluluğa Mentör Ekle</h2>
          <button id="close-admin-mentor-assign-modal" type="button" class="icon-btn" aria-label="Pencereyi kapat">
            ✕
          </button>
        </div>
        <form id="admin-mentor-assign-form" class="modal-form admin-mentor-assign-form">
          <p id="admin-mentor-assign-community" class="profile-hint"></p>
          <label for="admin-mentor-select">Mentör Seç</label>
          <select id="admin-mentor-select" required>
            <option value="" selected disabled>Mentör seçin</option>
          </select>
          <p id="admin-mentor-assign-message" class="form-message" role="status" hidden></p>
          <button id="admin-mentor-assign-submit" type="submit">Topluluğa Ekle</button>
        </form>
      </section>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
